name: fitness-studio CI

on:
  push:
    paths:
      - 'fitness-studio/**'
      - '.github/workflows/ci-fitness-studio.yml'
  pull_request:
    paths:
      - 'fitness-studio/**'
      - '.github/workflows/ci-fitness-studio.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitness-studio/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
