name: marketingovy-plan CI

on:
  push:
    paths:
      - 'marketingovy-plan/**'
      - '.github/workflows/ci-marketingovy-plan.yml'
  pull_request:
    paths:
      - 'marketingovy-plan/**'
      - '.github/workflows/ci-marketingovy-plan.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketingovy-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketingovy-plan/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
