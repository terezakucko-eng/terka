name: publikacni-plan CI

on:
  push:
    paths:
      - 'publikacni-plan/**'
      - '.github/workflows/ci-publikacni-plan.yml'
  pull_request:
    paths:
      - 'publikacni-plan/**'
      - '.github/workflows/ci-publikacni-plan.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publikacni-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publikacni-plan/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publikacni-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publikacni-plan/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules
